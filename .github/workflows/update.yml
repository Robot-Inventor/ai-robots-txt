name: Update ai.robots.txt

on:
    schedule:
        - cron: "0 0 * * 1"
    workflow_dispatch:

jobs:
    update:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write

        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2

            - run: bun install --frozen-lockfile
            - run: bun run update
            - name: Get current date
              id: date
              run: echo "::set-output name=date::$(date +'%Y-%m-%d')"
            - uses: peter-evans/create-pull-request@v8
              with:
                  commit-message: "feat: update ai.robots.txt (${{ steps.date.outputs.date }})"
                  delete-branch: true
                  title: "feat: update ai.robots.txt (${{ steps.date.outputs.date }})"
                  base: main
                  body: |
                      This PR was automatically generated to update `ai.robots.txt`.
                  branch: update-ai-robots-txt
                  reviewers: ${{ github.repository_owner }}
